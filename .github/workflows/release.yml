name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write                       # 必须：创建 Release + 上传资产

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false             # tag 触发的 job 不应被取消

jobs:
  release-macos:
    name: Build & release macOS
    runs-on: macos-latest               # 必须 mac runner（hdiutil + Xcode CLT + swift）
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/tauri-app/src-tauri
          key: ${{ github.ref_name }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # event-helper 是 Swift CLI，用作 tauri bundle 的 resource 打进 .app。
      # 强制重建（REBUILD_EVENT_HELPER=1）以免"改了 Swift 源码但忘了 commit 新二进制"
      # 的 CI 漂移——与 Electron 时期的 release 脚本行为一致。
      - name: Build event-helper (Swift)
        run: bun run build:event-helper
        env:
          REBUILD_EVENT_HELPER: '1'

      - name: Build macOS artifacts (Tauri)
        working-directory: packages/tauri-app
        # 双架构一次产出：arm64 与 x64 各一个 dmg，与原 electron-builder 的
        # `arch: [arm64, x64]` 一致。
        #
        # 不签名 / 不公证：CSC_LINK / APPLE_ID 等环境变量故意不设置，
        # 与迁移前 release.yml 的无签名策略对齐。
        #
        # 无 latest-mac.yml：那是 electron-updater 的产物格式，Tauri v1 的更新
        # 检查走 GitHub releases API（见 ADR 0003），不需要签名清单。
        run: bun run release

      - name: Enforce size budget (< 20 MB per dmg)
        run: |
          set -euo pipefail
          # dmg 文件名含空格(Tauri 用 productName_version_arch.dmg 命名)，
          # 所以必须用 -print0 / read -d '' 成对处理；未加引号的 for 会按空格分词，
          # 把 "Tiny Schedule_0.2.0_aarch64.dmg" 拆成两个词。
          found=0
          while IFS= read -r -d '' dmg; do
            found=1
            # dmg 是压缩镜像，du 报的是稀疏后的实际占用；用 du -h 与真实字节双口径核对
            size_kb=$(du -k "$dmg" | cut -f1)
            echo "$(du -h "$dmg" | cut -f1)  $dmg"
            if [ "$size_kb" -ge 20480 ]; then
              echo "::error::$dmg 为 ${size_kb}KB，超过 20MB 门禁"
              exit 1
            fi
          done < <(find packages/tauri-app/src-tauri/target/*/release/bundle/dmg -name '*.dmg' -print0 | sort -z)
          if [ "$found" -eq 0 ]; then
            echo "::error::没有找到任何 dmg 产物"; exit 1
          fi

      - name: Create GitHub Release & upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            packages/tauri-app/src-tauri/target/*/release/bundle/dmg/*.dmg

      - name: Upload workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-schedule-macos-${{ github.ref_name }}
          path: packages/tauri-app/src-tauri/target/*/release/bundle/dmg/*.dmg
          if-no-files-found: warn
          retention-days: 30