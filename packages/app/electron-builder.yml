appId: com.dkisser.tinyschedule
productName: Tiny Schedule
copyright: Copyright © 2026 dkisser
asar: true
directories:
  output: release                       # 相对 packages/app → packages/app/release
  buildResources: assets/build          # 图标、entitlements 等

# electron-vite 已经把 main/preload/renderer 全部打入 out/，这里只打包必要文件
files:
  - "out/**/*"
  - "assets/build/**/*"
  - "package.json"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/node_modules/*.d.ts"
  - "!**/node_modules/.bin"
  - "!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,xproj}"
  - "!.editorconfig"
  - "!**/._*"
  - "!**/{.DS_Store,.git,.hg,.svn,CVS,RCS,SCCS,.gitignore,.gitattributes}"

mac:
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: assets/build/entitlements.mac.plist
  entitlementsInherit: assets/build/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  extendInfo:
    NSHumanReadableCopyright: Copyright © 2026 dkisser
    NSCalendarsFullAccessUsageDescription: Tiny Schedule 需要访问系统日历以将任务作为事件写入。
  extraResources:
    - from: bin/event-helper
      to: bin/event-helper

dmg:
  title: ${productName} ${version}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380
  writeUpdateInfo: false

# 发布由 CI 中的 softprops/action-gh-release 单独处理（避免 electron-builder
# 用 package.json version 强制覆盖 pushed tag）。本配置仅负责产出 dmg。